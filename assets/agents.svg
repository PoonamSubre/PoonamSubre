<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Agent pipeline: query, orchestrator, retriever, generator, validator, human review, grounded answer">
<rect width="1200" height="320" rx="14" fill="#0f0d26"/>
<text x="40" y="38" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#c792ea">generate → validate → review → ship</text>
<path id="pa" d="M115,160 L340,160 C465,160 465,70 590,70 C720,70 720,160 850,160 L1085,160" fill="none" stroke="#4a4391" stroke-width="1.6"/><path id="pb" d="M115,160 L1085,160" fill="none" stroke="#4a4391" stroke-width="1.6"/><path id="pc" d="M115,160 L340,160 C465,160 465,250 590,250 C720,250 720,160 850,160 L1085,160" fill="none" stroke="#4a4391" stroke-width="1.6"/><circle r="5" fill="#82aaff"><animateMotion dur="5s" begin="0s" repeatCount="indefinite"><mpath href="#pa"/></animateMotion></circle><circle r="5" fill="#c792ea"><animateMotion dur="5s" begin="-1.7s" repeatCount="indefinite"><mpath href="#pb"/></animateMotion></circle><circle r="5" fill="#ff9e64"><animateMotion dur="5s" begin="-3.3s" repeatCount="indefinite"><mpath href="#pc"/></animateMotion></circle>
<rect x="40" y="130" width="150" height="60" rx="10" fill="#1b1940" stroke="#82aaff" stroke-width="1.6"/><text x="115.0" y="157" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="600" fill="#fff">Query</text><text x="115.0" y="176" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#9d95d6">user question</text>
<rect x="250" y="130" width="180" height="60" rx="10" fill="#1b1940" stroke="#c792ea" stroke-width="1.6"/><text x="340.0" y="157" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="600" fill="#fff">Orchestrator</text><text x="340.0" y="176" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#9d95d6">plans and routes</text>
<rect x="500" y="40" width="180" height="60" rx="10" fill="#1b1940" stroke="#82aaff" stroke-width="1.6"/><text x="590.0" y="67" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="600" fill="#fff">Retriever</text><text x="590.0" y="86" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#9d95d6">vector search</text>
<rect x="500" y="130" width="180" height="60" rx="10" fill="#1b1940" stroke="#c792ea" stroke-width="1.6"/><text x="590.0" y="157" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="600" fill="#fff">Generator</text><text x="590.0" y="176" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#9d95d6">drafts the answer</text>
<rect x="500" y="220" width="180" height="60" rx="10" fill="#1b1940" stroke="#ff9e64" stroke-width="1.6"/><text x="590.0" y="247" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="600" fill="#fff">Validator</text><text x="590.0" y="266" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#9d95d6">checks grounding</text>
<rect x="760" y="130" width="180" height="60" rx="10" fill="#1b1940" stroke="#c3e88d" stroke-width="1.6"/><text x="850.0" y="157" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="600" fill="#fff">Human review</text><text x="850.0" y="176" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#9d95d6">approves edge cases</text>
<rect x="1010" y="130" width="150" height="60" rx="10" fill="#1b1940" stroke="#c3e88d" stroke-width="1.6"/><text x="1085.0" y="157" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="600" fill="#fff">Answer</text><text x="1085.0" y="176" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#9d95d6">grounded, logged</text>
<path d="M590,220 L590,194" stroke="#ff9e64" stroke-width="1.6" stroke-dasharray="4 4" fill="none"/><polygon points="590,190 585,199 595,199" fill="#ff9e64"/>
<text x="600" y="210" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#ff9e64">retry</text>
<text x="40" y="296" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" fill="#8a83c4">Every run is evaluated for groundedness, relevance, latency and cost.</text>
</svg>